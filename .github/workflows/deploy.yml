name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: image
        shell: bash
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/backend:latest

    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_PREFIX,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu

            cd /opt/my-project

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            export GHCR_IMAGE_PREFIX="$IMAGE_PREFIX"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose \
              -f compose.prod.yaml \
              pull

            docker compose \
              -f compose.prod.yaml \
              up -d --remove-orphans

            docker image prune -f

            docker logout ghcr.io