name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Allow only one production deployment at a time.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: image
        shell: bash
        run: |
          set -euo pipefail

          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/backend:latest

  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Configure SSH through Cloudflare Access
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SERVER_SSH_KEY" || -z "$SERVER_HOST_KEY" ]]; then
            echo "ERROR: SERVER_SSH_KEY or SERVER_HOST_KEY secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Install the deployment private key.
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SERVER_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<'EOF'
          Host attend-my-event-server
              HostName ssh.rohansali.online
              User rohan
              Port 22
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/known_hosts
              ConnectTimeout 30
              ProxyCommand cloudflared access ssh --hostname %h --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo "SSH configuration completed."

      - name: Deploy application
        shell: bash
        env:
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}

          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

        run: |
          set -Eeuo pipefail

          # cloudflared reads the service token from its environment.
          export TUNNEL_SERVICE_TOKEN_ID="$CF_ACCESS_CLIENT_ID"
          export TUNNEL_SERVICE_TOKEN_SECRET="$CF_ACCESS_CLIENT_SECRET"

          # Never trace commands that contain credentials.
          set +x

          echo "Deploying Attend My Event commit: $IMAGE_TAG"

          # Send deployment variables over SSH stdin, not command arguments.
          {
            printf 'export IMAGE_PREFIX=%q\n' "$IMAGE_PREFIX"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"

            cat <<'REMOTE'
          set -Eeuo pipefail
          set +x

          cd /home/rohan/projects/attend-my-event

          echo "Logging in to GitHub Container Registry..."
          echo "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

          export GHCR_IMAGE_PREFIX="$IMAGE_PREFIX"
          export IMAGE_TAG

          echo "Pulling application images..."
          docker compose -f compose.prod.yaml pull

          echo "Updating application containers..."
          docker compose -f compose.prod.yaml up -d --remove-orphans

          # --interactive=false is important because this script is piped to the remote Bash process through SSH stdin.
          echo "Validating Nginx configuration..."
          docker compose -f compose.prod.yaml exec -T --interactive=false proxy nginx -t

          echo "Reloading Nginx..."
          docker compose -f compose.prod.yaml exec -T --interactive=false proxy nginx -s reload

          echo "Checking homepage..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8083/ \
            -o /dev/null

          echo "Checking backend API..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8083/api/ \
            -o /dev/null

          # Keep the three newest distinct image IDs per application repository.
          cleanup_old_images() {
            local repository="$1"
            local keep=3
            local image_id
            local count
            local -a image_ids=()

            echo "Cleaning old images in $repository..."

            mapfile -t image_ids < <(
              docker image ls "$repository" \
                --format '{{.ID}} {{.Tag}} {{.CreatedAt}}' |
                sort -k3,4r |
                awk '!seen[$1]++ { print $1 }'
            )

            count="${#image_ids[@]}"
            echo "Found $count image versions."

            if (( count <= keep )); then
              echo "No old images to remove."
              return 0
            fi

            for image_id in "${image_ids[@]:keep}"; do
              # Preserve images referenced by any existing container.
              if docker ps -aq |
                xargs -r docker inspect --format '{{.Image}}' |
                grep -Fxq "$image_id"; then
                echo "Keeping image $image_id because a container uses it."
                continue
              fi

              echo "Removing old image $image_id..."
              docker image rm "$image_id"
            done
          }

          cleanup_old_images "${GHCR_IMAGE_PREFIX}/frontend"
          cleanup_old_images "${GHCR_IMAGE_PREFIX}/backend"

          echo "Removing dangling images..."
          docker image prune -f

          echo "Logging out of GitHub Container Registry..."
          docker logout ghcr.io

          echo "Deployment completed successfully: $IMAGE_TAG"
          REMOTE
          } | ssh attend-my-event-server "bash -s"

          echo "Remote deployment completed successfully."