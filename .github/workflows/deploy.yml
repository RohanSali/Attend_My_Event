name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Prevent simultaneous production deployments.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGES
  # ============================================================
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: image
        shell: bash
        run: |
          set -euo pipefail

          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/backend:latest

  # ============================================================
  # JOB 2: DEPLOY TO UBUNTU SERVER
  # ============================================================
  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      # --------------------------------------------------------
      # Install Cloudflare Tunnel client
      # --------------------------------------------------------
      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version

      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------
      - name: Configure SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Install the deployment private key.
          printf '%s\n' "$SERVER_SSH_KEY" \
            > "$HOME/.ssh/deploy_key"

          chmod 600 "$HOME/.ssh/deploy_key"

          # Require a trusted server host key.
          if [[ -z "$SERVER_HOST_KEY" ]]; then
            echo "ERROR: SERVER_HOST_KEY secret is missing."
            exit 1
          fi

          printf '%s\n' "$SERVER_HOST_KEY" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          # Configure SSH to connect through Cloudflare Access.
          cat > "$HOME/.ssh/config" <<'EOF'
          Host attend-my-event-server
              HostName ssh.rohansali.online
              User rohan
              Port 22
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/known_hosts
              ConnectTimeout 30
              ProxyCommand cloudflared access ssh --hostname %h --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo "SSH configuration completed."

      # --------------------------------------------------------
      # Deploy application
      # --------------------------------------------------------
      - name: Deploy to Ubuntu server
        shell: bash
        env:
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}

          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

        run: |
          set -Eeuo pipefail

          # cloudflared reads the service token from its environment.
          export TUNNEL_SERVICE_TOKEN_ID="$CF_ACCESS_CLIENT_ID"
          export TUNNEL_SERVICE_TOKEN_SECRET="$CF_ACCESS_CLIENT_SECRET"

          # Never trace commands that contain credentials.
          set +x

          echo "=================================================="
          echo "Starting Attend My Event deployment"
          echo "Commit: $IMAGE_TAG"
          echo "=================================================="

          # Pass variables through SSH stdin, rather than placing
          # the GHCR token in the remote command arguments.
          {
            printf 'export IMAGE_PREFIX=%q\n' "$IMAGE_PREFIX"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"

            cat <<'REMOTE'
          set -Eeuo pipefail

          cd /home/rohan/projects/attend-my-event

          # Disable tracing while credentials are in use.
          set +x

          echo "========== STEP 1: REGISTRY LOGIN =========="

          echo "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

          echo "Registry login successful."

          # Supply the image configuration to Compose.
          export GHCR_IMAGE_PREFIX="$IMAGE_PREFIX"
          export IMAGE_TAG="$IMAGE_TAG"

          echo "========== STEP 2: PULL IMAGES =========="

          docker compose -f compose.prod.yaml pull

          echo "Image pull completed."

          echo "========== STEP 3: UPDATE CONTAINERS =========="

          docker compose -f compose.prod.yaml up -d --remove-orphans

          echo "Container deployment command completed."


          echo "========== STEP 5: RELOAD NGINX =========="

          docker compose -f compose.prod.yaml exec -T proxy nginx -s reload

          echo "MARKER 2: Nginx reload command returned."

          echo "========== STEP 6: VERIFY HOMEPAGE =========="

          # Retry transient startup failures.
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8083/ \
            -o /dev/null

          echo "MARKER 3: Homepage health check passed."

          echo "========== STEP 7: VERIFY BACKEND API =========="

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8083/api/ \
            -o /dev/null

          echo "MARKER 4: Backend API health check passed."

          echo "========== STEP 8: CLEAN OLD APPLICATION IMAGES =========="

          # Remove unused application images while preserving the
          # five newest tagged versions of each application image.
          #
          # Running containers are not removed by this procedure.
          # The currently deployed image is also retained.

          cleanup_old_images() {
            local repository="$1"
            local keep=5

            echo "Checking image repository: $repository"

            # List image IDs and tags, newest first.
            # The newest five distinct image IDs are retained.
            mapfile -t image_ids < <(
              docker image ls \
                "$repository" \
                --format '{{.ID}} {{.Tag}} {{.CreatedAt}}' |
                sort -k3,4r |
                awk '!seen[$1]++ { print $1 }'
            )

            local count="${#image_ids[@]}"

            echo "Found $count image versions for $repository."

            if (( count <= keep )); then
              echo "No old image versions need removal."
              return 0
            fi

            # Keep the newest five images and inspect the remainder.
            for image_id in "${image_ids[@]:keep}"; do

              # Never remove an image used by an existing container.
              if docker ps -a --format '{{.Image}} {{.ID}}' |
                while read -r container_image container_id; do
                  docker inspect \
                    --format '{{.Image}}' "$container_id" 2>/dev/null || true
                done |
                grep -Fxq "$image_id"; then

                echo "Skipping image $image_id because a container references it."
                continue
              fi

              echo "Removing old unused image: $image_id"

              # If Docker refuses to remove the image, report the
              # failure rather than silently pretending it succeeded.
              docker image rm "$image_id"
            done
          }

          cleanup_old_images \
            "${GHCR_IMAGE_PREFIX}/frontend"

          cleanup_old_images \
            "${GHCR_IMAGE_PREFIX}/backend"

          echo "MARKER 5: Application image cleanup completed."

          echo "========== STEP 9: REMOVE DANGLING IMAGES =========="

          docker image prune -f

          echo "MARKER 6: Dangling image cleanup completed."

          echo "========== STEP 10: REGISTRY LOGOUT =========="

          docker logout ghcr.io

          echo "MARKER 7: GHCR logout completed."

          echo "=================================================="
          echo "Attend My Event deployment completed successfully."
          echo "Deployed commit: $IMAGE_TAG"
          echo "=================================================="
          REMOTE
              } | ssh attend-my-event-server "bash -s"

              echo "Remote SSH deployment completed successfully."