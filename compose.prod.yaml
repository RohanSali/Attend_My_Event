services:
  frontend:
    image: ${GHCR_IMAGE_PREFIX}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  backend:
    image: ${GHCR_IMAGE_PREFIX}/backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      default: {}
      web:
        aliases:
          - attend-my-event-proxy
    restart: unless-stopped

networks:
  web:
    external: true